# Servidor da empresa (docker-compose.prod.yml): HTTPS obrigatório,
# exigência da Microsoft para o login fora do localhost

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/certificado.crt;
    ssl_certificate_key /etc/nginx/certs/certificado.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A API fica no mesmo endereço do site, em /api
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build têm o hash no nome: podem ficar em cache
    location /assets/ {
        expires 1y;
    }

    # Rotas do React Router (/agenda, /reservas...) sempre abrem o index.html,
    # que nunca fica em cache para a versão nova aparecer depois de atualizar
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }
}
