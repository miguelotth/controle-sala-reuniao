# Teste local: docker compose up -d --build
# Os valores vêm do arquivo .env da raiz (copie de .env.example).
# Sem ele, tudo funciona com os padrões abaixo, em modo prévia.
# No servidor da empresa use o docker-compose.prod.yml (veja o README).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      MYSQL_DATABASE: controle_sala_reuniao
      # CURDATE()/NOW() precisam do horário de Brasília
      TZ: America/Sao_Paulo
    volumes:
      # Os dados ficam neste volume e sobrevivem a "docker compose down"
      - dados_mysql:/var/lib/mysql
      # Cria a tabela só na primeira vez, com o volume vazio
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01_database.sql:ro
    ports:
      # 3307 para não brigar com um MySQL já instalado no Windows
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      DB_NAME: controle_sala_reuniao
      DB_PORT: 3306
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
        VITE_ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Mesma porta do "npm run dev", que já é o redirect cadastrado no Entra ID
      - "5173:80"

volumes:
  dados_mysql:
